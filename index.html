<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골라골라</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#222; --sub:#777; --line:#e4e0da; --accent:#2f6f4f; --accent2:#e8f2ec; --warn:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Malgun Gothic',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  nav { background:#fff; border-bottom:1px solid var(--line); }
  nav .in { max-width:820px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  nav .brand { font-weight:bold; font-size:18px; color:var(--accent); text-decoration:none; margin-right:auto; }
  nav .who { font-size:13px; color:var(--sub); }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:17px; margin:0 0 10px; } h3 { font-size:15px; margin:0 0 6px; }
  .sub { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  input[type=text], input[type=password], select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:220px; font-family:Consolas,monospace; font-size:13px; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  label.chk { display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0; color:var(--ink); font-size:14px; }
  button, a.btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.ghost, a.btn.ghost { background:#fff; color:var(--accent); }
  button.danger { border-color:var(--warn); color:var(--warn); background:#fff; }
  button.sm { padding:3px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:8px; margin-top:12px; } .tabs button { flex:1; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .row > .grow { flex:1; min-width:140px; }
  .menu-item { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .menu-item:last-child { border-bottom:0; } .menu-item .nm { flex:1; } .menu-item.sel { background:var(--accent2); border-radius:8px; }
  .price { color:var(--sub); font-size:13px; }
  .cat { font-weight:bold; margin:14px 0 2px; color:var(--accent); }
  .chip { display:inline-flex; align-items:center; gap:4px; background:var(--accent2); border-radius:14px; padding:2px 10px; margin:2px 4px 2px 0; font-size:14px; }
  .chip small { color:var(--sub); } .chip a { color:var(--warn); cursor:pointer; font-weight:bold; }
  .sumrow, .item-row { padding:8px 0; border-bottom:1px solid var(--line); } .sumrow:last-child, .item-row:last-child { border-bottom:0; }
  .badge { background:var(--warn); color:#fff; border-radius:6px; padding:1px 8px; font-size:12px; }
  .badge.ok { background:var(--accent); } .badge.wait { background:#d68910; } .badge.gray { background:#999; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; } .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  .hidden { display:none; } .msg { font-size:13px; margin-top:6px; } .msg.err { color:var(--warn); }
  a.task { display:block; color:inherit; text-decoration:none; } a.task:hover { background:var(--accent2); }
  img.preview { max-width:100%; max-height:260px; border-radius:8px; margin-top:8px; border:1px solid var(--line); }
  .tag { font-size:12px; background:#f0ede8; border-radius:4px; padding:0 6px; color:var(--sub); margin-right:4px; }
</style>
</head>
<body>
<nav><div class="in" id="nav"></div></nav>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supa.js"></script>
<script src="app.js"></script>
</body>
</html>
